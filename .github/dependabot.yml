version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: pre-commit
    directory: /
    schedule: {interval: monthly}
    groups: {hooks: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    groups: {images: {patterns: ["*"]}}
    # The base image follows the Python version the project develops on (.python-version);
    # moving to a new minor is a deliberate change, not a Dependabot bump.
    ignore:
      - dependency-name: python
        versions: [">= 3.15"]
